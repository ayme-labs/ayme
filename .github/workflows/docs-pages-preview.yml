# Throwaway: builds docs/guide with GitHub's Pages builder for a preview.
name: Docs Pages preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/guide
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
