name: Release

on:
  push:
    branches: [main]
  # A dry run: builds and checks the tarballs of any branch, publishes nothing.
  workflow_dispatch:

# Never cancel a release between creating its tags and publishing to npm.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'ayme-labs/ayme' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # The linked packages share a version and a commit, so any path released
    # stands for all of them. A retry reports only the releases it created, so
    # no one path is sure to be there.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs[format('{0}--version', fromJSON(steps.release.outputs.paths_released)[0])] }}
      sha: ${{ steps.release.outputs[format('{0}--sha', fromJSON(steps.release.outputs.paths_released)[0])] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main

  pack:
    name: Validate, build and pack
    needs: release-please
    # A dry run skips Release Please, which must not skip this job.
    if: >-
      !cancelled()
      && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release Please can release a merge newer than this run's push.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the packages
        run: pnpm exec turbo run build --filter='./packages/*'
      # The packed-consumer check opens a fresh Vite app in Chromium.
      - name: Install Chromium
        run: pnpm --filter @ayme-dev/ayme exec playwright install --with-deps chromium
      - name: Pack and run the packed-consumer check
        env:
          AYME_PACKED_DIR: ${{ runner.temp }}/packages
        run: pnpm --filter @ayme-dev/ayme test:package
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [release-please, pack]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Publish the checked tarballs
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: node scripts/publish-packages.mjs "$RUNNER_TEMP/packages" "$VERSION"
