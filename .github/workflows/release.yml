name: Release alpha

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm under the alpha dist-tag. Leave off for a dry run.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: Validate, build and pack
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish from a branch other than the default branch
        if: inputs.publish && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Publish only from $DEFAULT_BRANCH, not from $REF."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the shared alpha version
        run: node scripts/release-version.mjs
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the packages
        run: pnpm exec turbo run build --filter='./packages/*'
      # The packed-consumer check opens a fresh Vite app in Chromium.
      - name: Install Chromium
        run: pnpm --filter @ayme-dev/ayme exec playwright install --with-deps chromium
      - name: Pack and run the packed-consumer check
        env:
          AYME_PACKED_DIR: ${{ runner.temp }}/packages
        run: pnpm --filter @ayme-dev/ayme test:package
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: pack
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      # @ayme-dev/ayme goes first because every other package depends on it.
      # The rest go alphabetically, which puts @ayme-dev/inspector before
      # @ayme-dev/unplugin-ayme, its only dependent.
      - name: Publish the checked tarballs
        run: |
          npm publish packages/ayme-dev-ayme-*.tgz --tag alpha
          for tarball in packages/*.tgz; do
            case "$tarball" in packages/ayme-dev-ayme-*) continue ;; esac
            npm publish "$tarball" --tag alpha
          done
