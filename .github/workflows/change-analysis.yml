name: Change analysis

# Runs `pnpm analyze:changed` on a pull request's changed source and posts the
# report to the run summary. Report only: findings never fail the pull request,
# and a run that breaks is marked as passing. See docs/testing.md#change-analysis.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # An edit to this workflow runs it too, so the job is tested before it merges.
    paths:
      - packages/*/src/**
      - .github/workflows/change-analysis.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Decide whether to analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      analyze: ${{ steps.merge.outputs.analyze }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # A push that only merges the base branch into the pull request leaves
      # the pull request's own changes as they were, so the report made for
      # the commit before the merge still holds. It counts as only a merge
      # when its tree is the clean merge of its parents, without a conflict
      # resolved or a file edited on the way. A run has a report when it has
      # a "Report written" step that succeeded. Without one, for example when
      # this push cancelled that run or its analysis broke, the merge is
      # analyzed.
      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          SYNCHRONIZE: ${{ github.event.action == 'synchronize' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          report=
          if [ "$SYNCHRONIZE" = true ]; then
            read -r _ before merged rest <<< "$(git rev-list --parents -n 1 "$HEAD_SHA")"
            if [ -n "${merged:-}" ] && [ -z "${rest:-}" ] &&
              git merge-base --is-ancestor "$merged" "origin/$BASE_REF" &&
              [ "$(git merge-tree --write-tree "$before" "$merged" 2>/dev/null)" = "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
              for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/change-analysis.yml/runs?head_sha=$before&status=success" \
                --jq ".workflow_runs[] | select(any(.pull_requests[]; .number == $PR)) | .id"); do
                if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[].steps[] | select(.name == "Report written" and .conclusion == "success")] | length')" -gt 0 ]; then
                  report=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .html_url)
                  break
                fi
              done
            fi
          fi
          if [ -n "$report" ]; then
            echo "analyze=false" >> "$GITHUB_OUTPUT"
            echo "This push only merges \`$BASE_REF\` into the pull request. The report for its changes is in [the run for ${before:0:7}]($report)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "analyze=true" >> "$GITHUB_OUTPUT"
          fi
      # A merge after this one finds the report through this run.
      - name: Report written
        if: steps.merge.outputs.analyze == 'false'
        run: "true"

  analyze:
    name: Analyze changed source
    needs: scope
    if: needs.scope.outputs.analyze == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Stryker's incremental mode re-tests only the mutants whose code or
      # tests changed since the pull request's last run, and reports the rest
      # with their earlier status. It cannot see a change to the lockfile, a
      # patch or the test config, so any of those starts again from nothing.
      - id: stryker-restore
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: packages/*/reports/stryker-incremental.json
          key: stryker-incremental-pr${{ github.event.pull_request.number }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**', 'packages/test-config/*.js', 'packages/*/stryker.config.mjs', 'packages/*/vitest*.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stryker-incremental-pr${{ github.event.pull_request.number }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**', 'packages/test-config/*.js', 'packages/*/stryker.config.mjs', 'packages/*/vitest*.ts') }}-
      # Stryker cannot read a results file that was cut short or lacks its
      # files and mutants, and it would then fail on every later push. Such a
      # file is dropped, so that package tests every mutant again.
      - if: steps.stryker-restore.outputs.cache-matched-key != ''
        run: |
          for file in packages/*/reports/stryker-incremental.json; do
            node -e '
              const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              if (!Object.values(report.files).every((file) => Array.isArray(file.mutants))) process.exit(1);
            ' "$file" 2>/dev/null || { echo "Dropping $file: Stryker cannot read it."; rm -f "$file"; }
          done
      # A pull request's checkout is its merge commit, whose first parent is
      # the base it merges into. A dispatch compares with where it left main.
      - id: analysis
        run: pnpm analyze:changed ${BASE:+--base "$BASE"} ${INCREMENTAL:+--incremental}
        continue-on-error: true
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          INCREMENTAL: ${{ github.event_name == 'pull_request' && 'true' || '' }}
      - if: always()
        run: cat reports/analyze-changed.md >> "$GITHUB_STEP_SUMMARY" || echo "No report was written; see the analysis step's log." >> "$GITHUB_STEP_SUMMARY"
      # The scope job of a later merge looks for this step.
      - name: Report written
        if: steps.analysis.outcome == 'success'
        run: "true"
      # A cache entry cannot be overwritten, so each run saves under its own
      # key. A run that a newer push cancelled saves nothing, because Stryker
      # may have been stopped while writing its results.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: packages/*/reports/stryker-incremental.json
          key: ${{ steps.stryker-restore.outputs.cache-primary-key }}
