name: Publish core alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate alpha version
        run: node -e 'const { version } = require("./packages/core/package.json"); if (!/^\d+\.\d+\.\d+-alpha\.\d+$/.test(version)) throw new Error("Expected an alpha prerelease version, received " + version)'
      - name: Build and verify package
        run: pnpm --filter @ayme-dev/core test:package "$RUNNER_TEMP/core-package"
      - uses: actions/upload-artifact@v4
        with:
          name: core-package
          path: |
            ${{ runner.temp }}/core-package/*.tgz
            ${{ runner.temp }}/core-package/verification.json
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: core-package
          path: core-package
      - run: npm publish core-package/*.tgz --tag alpha
