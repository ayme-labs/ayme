name: First-install eval

# Runs apps/eval-first-install: a worker installs and uses Ayme beside each
# browser automation, as a first-time user would, on a fresh runner per run.
# Started by hand only, because every run calls the model and costs money.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The ref whose packages, skill and guide are tested
        type: string
        default: main
      runs:
        description: Runs per tool
        type: number
        default: 3
      tools:
        description: Comma-separated, from playwright-cli, playwright-mcp and agent-browser
        type: string
        default: playwright-cli,playwright-mcp,agent-browser

# One round at a time: every run uses the same Claude Code login.
concurrency:
  group: eval-first-install
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The Claude Code the worker runs, as in eval-formbricks.yml.
  CLAUDE_CODE_VERSION: 2.1.326

jobs:
  plan:
    name: Plan the round
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          RUNS: ${{ inputs.runs }}
          TOOLS: ${{ inputs.tools }}
        run: |
          node -e '
            const tools = process.env.TOOLS.split(",").map((t) => t.trim()).filter(Boolean);
            const include = tools.flatMap((tool) =>
              Array.from({ length: Number(process.env.RUNS) }, (_, i) => ({ tool, run: i + 1 })));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              `matrix=${JSON.stringify({ include })}\n`);
            console.log(JSON.stringify(include));
          '

  pack:
    name: Pack the ref and check the harness
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.packed.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Pack the ref
        id: packed
        working-directory: apps/eval-first-install
        env:
          REF: ${{ inputs.ref }}
        run: |
          node src/pack.ts --ref "$REF" --out "$RUNNER_TEMP/packed"
          echo "sha=$(node -p 'require(process.env.RUNNER_TEMP + "/packed/meta.json").sha')" >> "$GITHUB_OUTPUT"
      # The task done by a script instead of a worker: proves the registry,
      # the install, the fixture and the served Page Objects fit together
      # before any model is paid for.
      - name: Self-check
        working-directory: apps/eval-first-install
        run: node src/run.ts --tool playwright-cli --agent none --packed "$RUNNER_TEMP/packed" --out results/self-check
      - uses: actions/upload-artifact@v4
        with:
          name: packed
          path: ${{ runner.temp }}/packed
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: self-check
          path: apps/eval-first-install/results/self-check
          include-hidden-files: true
          if-no-files-found: ignore

  run:
    name: Run ${{ matrix.tool }} ${{ matrix.run }}
    needs: [plan, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: packed
          path: ${{ runner.temp }}/packed
      - name: Install Claude Code
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
          google-chrome --version
      - name: Run
        working-directory: apps/eval-first-install
        env:
          # The eval's second login. eval-formbricks.yml uses the first and
          # falls back to this one.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
        run: >-
          node src/run.ts --tool "${{ matrix.tool }}"
          --packed "$RUNNER_TEMP/packed"
          --out "results/runs/${{ matrix.tool }}-${{ matrix.run }}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.tool }}-${{ matrix.run }}
          path: apps/eval-first-install/results/runs/
          include-hidden-files: true
          if-no-files-found: ignore

  score:
    name: Score the round
    needs: [pack, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: run-*
          path: apps/eval-first-install/results/runs
          merge-multiple: true
      - name: Score
        working-directory: apps/eval-first-install
        env:
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.pack.outputs.sha }}
        run: |
          shopt -s nullglob
          dirs=(results/runs/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No run left any results." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node src/score.ts "${dirs[@]}" --json results/scores.json > results/scores.md
          {
            echo "### First-install eval: $REF at $SHA"
            echo
            cat results/scores.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat results/scores.md
      - uses: actions/upload-artifact@v4
        with:
          name: scores
          path: |
            apps/eval-first-install/results/scores.md
            apps/eval-first-install/results/scores.json
          if-no-files-found: ignore
