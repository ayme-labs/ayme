name: Playwright Lite integration

on:
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/webmcp/**"
      - "apps/example-vue/**"
      - ".github/workflows/playwright-lite.yml"
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/webmcp/**"
      - ".github/workflows/playwright-lite.yml"

permissions:
  contents: read

concurrency:
  group: playwright-lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEFTHOOK: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@v0.12.0
        with:
          devbox-version: 0.18.3
          enable-cache: true
          disable-nix-access-token: true
      - name: Cold Git dependency install and integration checks
        run: |
          devbox run -- bash <<'SCRIPT'
          set -euo pipefail
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/lite-store"
          pnpm --filter @ayme-dev/example-next exec playwright install --with-deps chromium
          pnpm check
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml devbox.lock
          SCRIPT
      - name: Upload browser failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lite-integration-results
          path: |
            packages/webmcp/test-results
            apps/*/test-results
          if-no-files-found: ignore
