name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected package checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      package_checks: ${{ steps.detect.outputs.package_checks }}
      compatibility_packages: ${{ steps.compatibility.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Detect affected package tasks
        id: detect
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -eo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: running all package checks."
            echo "package_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          affected=$(pnpm exec turbo run build lint typecheck test test:e2e --affected --dry=json \
            | jq '[.tasks[] | select(.command != "<NONEXISTENT>")] | length')

          echo "Affected package tasks: $affected"
          echo "package_checks=$([ "$affected" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # A lane runs when a change reaches its package: the package itself or
      # anything it depends on. A change to this workflow runs every lane, so
      # an edited lane is tested before it merges.
      - name: Detect affected compatibility lanes
        id: compatibility
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -eo pipefail

          affected=--affected
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || ! git diff --quiet "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" -- .github/workflows/ci.yml; then
            affected=
          fi

          packages=$(pnpm exec turbo ls $affected --output=json | jq -c '[.packages.items[].name]')
          echo "Packages the compatibility lanes check: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.package_checks == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - name: Lint commits
        if: github.event_name == 'pull_request'
        run: pnpm run commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - run: pnpm run boundaries
      - name: Run affected package checks
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec turbo run build lint typecheck test test:e2e --affected --continue=dependencies-successful
      - name: Run full package checks
        if: github.event_name != 'pull_request'
        run: pnpm exec turbo run build lint typecheck test test:e2e --continue=dependencies-successful
      - run: pnpm run format:check
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            packages/ayme/test-results
            apps/*/test-results
          if-no-files-found: ignore

  live-goals:
    name: Live goals
    needs: changes
    if: needs.changes.outputs.package_checks == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      # The lane skips itself with a visible message when no secret is set,
      # as for a pull request from a fork, and uses the TypeSafe key when both
      # are. Keys are only ever passed through the environment, never echoed.
      - name: Run the live goal lane
        env:
          AYME_TYPESAFE_API_KEY: ${{ secrets.AYME_TYPESAFE_API_KEY }}
          AYME_OPENROUTER_API_KEY: ${{ secrets.AYME_OPENROUTER_API_KEY }}
        run: pnpm exec turbo run test:goals --filter=@ayme-dev/example-vue

  compatibility:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.compatibility_packages != '[]'
    runs-on: ubuntu-latest
    env:
      AFFECTED: ${{ contains(fromJSON(needs.changes.outputs.compatibility_packages), matrix.package) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vue 3.2 compatibility
            package: "@ayme-dev/vue"
            dir: packages/vue
            version: "3.2.0"
            pins: vue @vue/server-renderer
            build: "@ayme-dev/ayme"
          - name: Svelte 3.54.0 compatibility
            package: "@ayme-dev/svelte"
            dir: packages/svelte
            version: "3.54.0"
            pins: svelte
            build: "@ayme-dev/ayme"
          # @angular/animations 19.0.0, which @angular/platform-server loads,
          # imports @angular/common without declaring it, so it would reach the
          # workspace's hoisted Angular 22. The extension links it to 19.0.0.
          - name: Angular 19.0 compatibility
            package: "@ayme-dev/angular"
            dir: packages/angular
            version: "19.0.0"
            pins: >-
              @angular/core @angular/common @angular/compiler
              @angular/platform-browser @angular/platform-server
              @angular-devkit/schematics @schematics/angular
            build: "@ayme-dev/angular..."
            workspace: |
              packageExtensions:
                "@angular/animations@19.0.0":
                  peerDependencies:
                    "@angular/common": 19.0.0
          # React 18.0.0's own @types/react needs an old @types/scheduler, so
          # the lane pairs the runtime with the 18.3 type packages.
          - name: React 18.0.0 compatibility
            package: "@ayme-dev/react"
            dir: packages/react
            version: "18.0.0"
            pins: react react-dom @types/react@18.3.31 @types/react-dom@18.3.7
            build: "@ayme-dev/ayme"
          # The Next, Nuxt and SvelteKit minima run the example apps' build,
          # typecheck and E2E suites, with every framework process on the Node
          # floor.
          - name: Next 16.0 compatibility
            package: "@ayme-dev/example-next"
            dir: apps/example-next
            version: "16.0.0"
            pins: next
            build: "@ayme-dev/example-next^..."
            node: "20.19.0"
            e2e: true
          - name: Nuxt 4.0.1 compatibility
            package: "@ayme-dev/example-nuxt"
            dir: apps/example-nuxt
            version: "4.0.1"
            pins: nuxt
            build: "@ayme-dev/example-nuxt^..."
            node: "20.19.0"
            e2e: true
          # SvelteKit 2.53.0 is the first release that accepts Vite 8 and
          # vite-plugin-svelte 7, which the example runs on.
          - name: SvelteKit 2.53.0 compatibility
            package: "@ayme-dev/example-sveltekit"
            dir: apps/example-sveltekit
            version: "2.53.0"
            pins: "@sveltejs/kit"
            build: "@ayme-dev/example-sveltekit^..."
            node: "20.19.0"
            e2e: true
          # The Angular example uses APIs and an angular.json setting from
          # Angular 21 and @angular/build 21.1.5, so its floor is above the
          # package's. @ayme-dev/angular resolves Angular from its own
          # devDependencies, so `linked` pins them too, or the app would load
          # two Angular cores.
          - name: Angular 21.0 example compatibility
            package: "@ayme-dev/example-angular"
            dir: apps/example-angular
            version: "21.0.0"
            pins: >-
              @angular/common @angular/compiler @angular/core
              @angular/platform-browser @angular/platform-server
              @angular/router @angular/ssr @angular/cli @angular/compiler-cli
              @angular/build@21.1.5 @angular-builders/custom-esbuild@21.1.0
              typescript@5.9.3
            linked: packages/angular
            build: "@ayme-dev/example-angular^..."
            node: "20.19.0"
            e2e: true
    steps:
      - name: Skip, no change reaches ${{ matrix.package }}
        if: env.AFFECTED != 'true'
        run: echo "No change in this pull request reaches ${{ matrix.package }}."
      - uses: actions/checkout@v7
        if: env.AFFECTED == 'true'
      - uses: actions/setup-node@v7
        if: env.AFFECTED == 'true'
        with:
          node-version: 24
      - run: corepack enable
        if: env.AFFECTED == 'true'
      - name: Resolve pnpm store path
        if: env.AFFECTED == 'true'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        if: env.AFFECTED == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-
      - name: Install the pinned minimum versions
        if: env.AFFECTED == 'true'
        env:
          DIR: ${{ matrix.dir }}
          LINKED: ${{ matrix.linked }}
          PINS: ${{ matrix.pins }}
          VERSION: ${{ matrix.version }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          # A pin is a package name, set to the lane's version, or name@version.
          for pin in $PINS; do
            case "$pin" in
              ?*@*) package="${pin%@*}" version="${pin##*@}" ;;
              *) package="$pin" version="$VERSION" ;;
            esac
            section=devDependencies
            if [ -n "$(jq -r --arg p "$package" '.dependencies[$p] // empty' "$DIR/package.json")" ]; then
              section=dependencies
            fi
            pnpm --dir "$DIR" pkg set "$section[\"$package\"]=$version"
            # A linked workspace package takes the pins it already lists.
            for dir in $LINKED; do
              if [ -n "$(jq -r --arg p "$package" '.devDependencies[$p] // empty' "$dir/package.json")" ]; then
                pnpm --dir "$dir" pkg set "devDependencies[\"$package\"]=$version"
              fi
            done
          done
          if [ -n "$WORKSPACE" ]; then
            printf '%s' "$WORKSPACE" >> pnpm-workspace.yaml
          fi
          pnpm install --no-frozen-lockfile
      - name: Build ${{ matrix.build }}
        if: env.AFFECTED == 'true'
        run: pnpm exec turbo run build --filter=${{ matrix.build }}
      - name: Install Chromium
        if: env.AFFECTED == 'true' && matrix.e2e
        run: pnpm --filter ${{ matrix.package }} exec playwright install --with-deps chromium
      # pnpm 11 needs Node 22.13, so pnpm stays on this Node 24 while the
      # scripts it starts resolve `node` from PATH, which becomes the floor.
      - name: Keep pnpm on Node 24
        if: env.AFFECTED == 'true' && matrix.node
        run: |
          shim="$RUNNER_TEMP/pnpm-node24"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$(command -v node)" "$(readlink -f "$(command -v pnpm)")" > "$shim/pnpm"
          chmod +x "$shim/pnpm"
      - uses: actions/setup-node@v7
        if: env.AFFECTED == 'true' && matrix.node
        with:
          node-version: ${{ matrix.node }}
      - name: Run the framework on Node ${{ matrix.node }}
        if: env.AFFECTED == 'true' && matrix.node
        env:
          NODE_FLOOR: ${{ matrix.node }}
        run: |
          echo "$RUNNER_TEMP/pnpm-node24" >> "$GITHUB_PATH"
          test "$(node --version)" = "v$NODE_FLOOR"
      - name: Build ${{ matrix.package }}
        if: env.AFFECTED == 'true' && matrix.e2e
        run: pnpm --filter ${{ matrix.package }} build
      - name: Typecheck ${{ matrix.package }}
        if: env.AFFECTED == 'true'
        run: pnpm --filter ${{ matrix.package }} typecheck
      - name: Test ${{ matrix.package }}
        if: env.AFFECTED == 'true'
        run: pnpm --filter ${{ matrix.package }} ${{ matrix.e2e && 'test:e2e' || 'test' }}

  # Branch protection requires this job instead of the lanes, because a
  # skipped matrix job reports under its unexpanded name.
  compatibility-gate:
    name: Compatibility
    needs: compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane to pass or be skipped
        env:
          RESULT: ${{ needs.compatibility.result }}
        run: test "$RESULT" = success -o "$RESULT" = skipped
