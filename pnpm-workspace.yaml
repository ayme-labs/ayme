packages:
  - apps/*
  - packages/*
allowBuilds:
  "@ayme-dev/playwright-lite@https://codeload.github.com/ayme-labs/playwright-lite/tar.gz/9f39340948ad0565df835d003c62522e18fa3593": true
  "@parcel/watcher": false
  esbuild: true
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  # Next before 16.3 brings sharp 0.34, whose install script is not needed.
  sharp: false
  unrs-resolver: false
  vue-demi: false
minimumReleaseAgeExclude:
  - "@vue/compiler-core@3.5.42"
  - "@vue/compiler-dom@3.5.42"
  - "@vue/compiler-sfc@3.5.42"
  - "@vue/compiler-ssr@3.5.42"
  - "@vue/reactivity@3.5.42"
  - "@vue/runtime-core@3.5.42"
  - "@vue/runtime-dom@3.5.42"
  - "@vue/server-renderer@3.5.42"
  - "@vue/shared@3.5.42"
  - vue@3.5.42
# rolldown 1.2.12, which vite 8.3.0 (from @angular/build) would bring into
# Nuxt's peer set, crashes vue-tsc in nuxt typecheck. 1.2.8 is the version
# @angular/build pins.
overrides:
  rolldown@1.2.12: 1.2.8
patchedDependencies:
  # The runner reports module-load mutants as runtime errors. Keep them in the
  # mutation score by reporting a failed test file, so they count as killed.
  "@stryker-mutator/vitest-runner@10.1.1": patches/@stryker-mutator__vitest-runner@10.1.1.patch
  # madge skips `import { type T }` and `export { type T } from` as type-only,
  # but they keep an empty runtime import; the patch keeps them as edges so
  # scripts/check-cycles.mjs sees them.
  detective-typescript@14.1.2: patches/detective-typescript@14.1.2.patch
