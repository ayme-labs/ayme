<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stand-in Agent App</title>
    <style>
      /* A generic chat, as an Agent App shows an MCP App inside it: a
         transcript column of a chat's width, with the frame in the agent's
         turn. It imitates no real Agent App. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f4f5;
        color: #18181b;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid #e4e4e7;
        background: #fff;
        font-weight: 600;
      }
      .bar small {
        font-weight: 400;
        color: #71717a;
      }
      .transcript {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .user {
        align-self: flex-end;
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 12px;
        background: #e4e4e7;
      }
      .tool {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 6px 10px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        background: #fff;
        font-size: 12px;
        color: #52525b;
      }
      .tool code {
        font:
          12px ui-monospace,
          monospace;
        color: #18181b;
      }
      #app {
        width: 100%;
        height: 200px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        background: #fff;
      }
      /* Granted fullscreen, the frame covers the Agent App's window. */
      .fullscreen #app {
        position: fixed;
        inset: 0;
        height: 100% !important;
        border: 0;
        border-radius: 0;
        z-index: 1;
      }
      /* In the flow, after the transcript: nothing covers the frame. */
      .composer {
        padding: 0 16px 16px;
      }
      .composer div {
        max-width: 688px;
        margin: 0 auto;
        padding: 10px 12px;
        border: 1px solid #d4d4d8;
        border-radius: 12px;
        background: #fff;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      Stand-in Agent App <small>a test fixture, not a real Agent App</small>
    </header>
    <main class="transcript">
      <div class="user">Open the Ayme Inspector for this page.</div>
      <div class="tool">
        <span>Called <code>ayme_inspect</code></span>
        <code id="result"></code>
      </div>
      <!-- Sandboxed as T3 Code's in-chat frame, the strictest measured:
           scripts and forms run, but its origin is opaque, so storage throws
           and its requests say `null`. -->
      <iframe
        id="app"
        title="MCP App"
        sandbox="allow-scripts allow-forms"
      ></iframe>
    </main>
    <footer class="composer"><div>Ask the agent…</div></footer>
    <script type="module" src="./agentApp.ts"></script>
  </body>
</html>
