<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arrival</title>
  </head>
  <body>
    <h1>Arrived</h1>
    <button id="count-up">Count up</button>
    <p id="count">Count: 0</p>
    <script>
      let count = 0;
      document.getElementById("count-up").addEventListener("click", () => {
        count += 1;
        document.getElementById("count").textContent = `Count: ${count}`;
      });
    </script>
  </body>
</html>
