<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Log in</title>
  </head>
  <body>
    <h1>Log in</h1>
    <!-- A stand-in for a login, never a real one: "Log in" sets a cookie and
         a local storage entry, and the page says who is logged in once it
         has both. -->
    <p id="who">Not logged in</p>
    <button id="login">Log in</button>
    <!-- The cart on another origin of the same server: 127.0.0.1 and
         localhost are two origins. -->
    <a id="elsewhere">Go elsewhere</a>
    <script>
      const who = document.getElementById("who");
      const show = () => {
        const session = document.cookie
          .split("; ")
          .some((cookie) => cookie === "session=s3cret");
        const user = localStorage.getItem("user");
        who.textContent =
          session && user ? `Logged in as ${user}` : "Not logged in";
      };
      show();
      document.getElementById("login").addEventListener("click", () => {
        document.cookie = "session=s3cret; path=/; max-age=3600";
        localStorage.setItem("user", "ada");
        show();
      });
      const elsewhere = new URL("/cart.html", location.href);
      elsewhere.hostname =
        location.hostname === "localhost" ? "127.0.0.1" : "localhost";
      document.getElementById("elsewhere").href = elsewhere.href;
    </script>
  </body>
</html>
