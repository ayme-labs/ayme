<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inspector dogfood</title>
  </head>
  <body>
    <!-- The list app, with the Inspector mounted for dogfooding: its own
         Page Object is registered, so an agent on the Agent Connection, or
         a test over WebMCP, drives the panel through Page Object Tools. -->
    <main>
      <h1>Groceries</h1>
      <label>New item <input /></label>
      <label><input type="checkbox" /> Urgent</label>
      <button type="button">Add item</button>
      <button type="button">Clear</button>
      <ul aria-label="Items"></ul>
    </main>
    <script type="module" src="./dogfood.ts"></script>
  </body>
</html>
