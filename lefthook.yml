pre-commit:
  # Stop at the first failing job.
  piped: true
  jobs:
    - name: lint-staged
      run: pnpm exec lint-staged --concurrent false
    # Check only the workspaces the staged change reaches, within the cap in
    # scripts/pre-commit-checks.mjs. Why: docs/testing.md#local-runs-and-ci.
    - name: typecheck and test
      run: node scripts/pre-commit-checks.mjs

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --verbose --edit {1}
