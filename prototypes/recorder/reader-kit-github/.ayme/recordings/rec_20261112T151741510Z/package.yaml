                        - [ref=e2454] paragraph:
                          - text: "Measured on 2026-10-23 and 2026-10-24 on GitHub-hosted Ubuntu runners, at"
                          - [ref=e2455] link:
                            - [ref=e2456] code: 8a9aad6
                          - text: ", which is"
                          - [ref=e2457] code: main
                          - text: "with the lab app's overlay repinned, with Claude Code 2.1.281 on Sonnet ("
                          - [ref=e2458] code: claude-sonnet-5
                          - text: ") at medium effort, on Formbricks at the lab overlay"
                          - [ref=e2459] link:
                            - [ref=e2460] code: bf06fa5
                          - text: ". Time, tokens, cost and calls are the task's alone: each run first gets the agent ready in a message of its own, which is not counted. Tokens, input and output, are the agent's own input and output tokens. Tokens, all, add the reads and writes of its prompt cache, which carries the page state and tool results from turn to turn. The cost is Claude Code's own figure, plus the Goal Loop's own model cost where it ran. \"No page objects\" is the same app with its page objects switched off, so the agent and the Goal Loop work with Ayme's Browser Tools alone. The full results, with every version a rerun must match, are in"
                          - [ref=e2461] link "the dated summary"
                          - text: ;
                          - [ref=e2462] link "a longer mission"
                          - text: ", which signs in, creates a survey and revises it, ran the same way. The three-run results of 2026-10-15 are in"
                          - [ref=e2463] link "their summary"
                          - text: ", the earlier results from a Mac are in"
                          - [ref=e2464] link "the 2026-10-06 summary"
                          - text: ", and"
                          - [ref=e2465] link "the eval"
                          - text: reruns them.
                        - [ref=e2466]:
                          - [ref=e2467] heading "What you can do with it" [level=2]
                          - [ref=e2468] link "Permalink: What you can do with it"
                        - [ref=e2471] list:
                          - [ref=e2472] listitem:
                            - [ref=e2473] strong: Drive your app from your coding agent.
                            - text: "Claude Code, or any MCP client, calls your Page Object Actions on the page you have open, reads what is on the page and acts on it, while you develop."
                          - [ref=e2474] listitem:
                            - [ref=e2475] strong: Hand the page a goal.
                            - text: "An agent says \"invite Ada as an admin\", and the Goal Loop works the page toward it in small steps, each one judged by Jev, TypeSafe's decision model, instead of the agent's own LLM."
                          - [ref=e2476] listitem:
                            - [ref=e2477] strong: Build an in-app assistant.
                            - text: "An onboarding assistant inside your app gets your Page Object Actions and the page state as its tools, so it works the page while the user watches. A checklist's \"Show me how\" button can run the same actions directly. See"
                            - [ref=e2478] link "Build an in-app assistant"
                            - text: .
                        - [ref=e2479]:
                          - [ref=e2480] heading "How it works" [level=2]
                          - [ref=e2481] link "Permalink: How it works"
                        - [ref=e2484] paragraph: "You mark a Page Object Model and the actions to expose. The build plugin compiles them into your app, and when the app runs, Ayme offers three kinds of tools to agents: to a coding agent through Ayme's MCP server, and to agents in the browser through WebMCP, the browser's way of offering tools on a page:"
                        - [ref=e2485] list:
                          - [ref=e2486] listitem:
                            - [ref=e2487] strong: Page Object Tools
                            - text: ": your marked actions, such as"
                            - [ref=e2488] code: ProjectsPage.createProject
                            - text: .
                          - [ref=e2489] listitem:
                            - [ref=e2490] strong: Browser Tools
                            - text: ": built-in operations on the page, such as"
                            - [ref=e2491] code: click
                            - text: and
                            - [ref=e2492] code: fill
                            - text: ", aimed at what"
                            - [ref=e2493] code: snapshot
                            - text: shows.
                          - [ref=e2494] listitem:
                            - [ref=e2495] strong: Custom Tools
                            - text: ": operations of your own on one element, such as highlighting it for the user."
                        - [ref=e2496] paragraph:
                          - text: "While you develop, a coding agent also gets"
                          - [ref=e2497] strong: Peek Tools
                          - text: ": they read app state the page does not show, such as a store or what your server holds, from the page and from your app's own Node processes. WebMCP never publishes them. See"
                          - [ref=e2498] link:
                            - [ref=e2499] code: ayme.peek
                          - text: .
                        - [ref=e2500] paragraph:
                          - text: The
                          - [ref=e2501] strong: Goal Loop
                          - text: "runs on top of them:"
                          - [ref=e2502] code: goal
                          - text: takes a goal in natural language and lets Jev pick one operation per step until the goal is met or it needs the agent. Jev is reached through a
                          - [ref=e2503] strong: Decision Endpoint
                          - text: ", one route in your backend, or in your dev server while you develop, that adds your TypeSafe or OpenRouter key."
                        - [ref=e2504] paragraph:
                          - text: The
                          - [ref=e2505] strong: Inspector
                          - text: "is an in-page panel that shows your Page Objects, what the agent sees and every tool, and runs them by hand."
                        - [ref=e2506] paragraph:
                          - [ref=e2507] link:
                            - [ref=e2508] img "The Inspector's Tools lens listing Page Object Tools and Browser Tools"
                        - [ref=e2509]:
                          - [ref=e2510] heading "Install" [level=2]
                          - [ref=e2511] link "Permalink: Install"
                        - [ref=e2514]:
                          - [ref=e2515]:
                            - text: "npm install @ayme-dev/ayme @ayme-dev/vue"
                            - [ref=e2516]: "# or react, svelte"
                            - text: "npm install -D @ayme-dev/unplugin-ayme @playwright/test"
                          - [ref=e2518] button "Copy code to clipboard"
                        - [ref=e2522] paragraph:
                          - text: "On Angular,"
                          - [ref=e2523] code: "ng add @ayme-dev/angular"
                          - text: "sets everything up. Then mark a Page Object Model:"
                        - [ref=e2524]:
                          - [ref=e2525]: "import { ayme } from \"@ayme-dev/ayme\"; import type { Page } from \"@playwright/test\"; @ayme export class ProjectsPage { private readonly page: Page; constructor(page: Page) { this.page = page; } @ayme.action async createProject(name: string) { await this.page.getByRole(\"button\", { name: \"New project\" }).click(); await this.page.getByRole(\"textbox\", { name: \"Project name\" }).fill(name); await this.page.getByRole(\"button\", { name: \"Create\" }).click(); } }"
                          - [ref=e2527] button "Copy code to clipboard"
                        - [ref=e2531] paragraph:
                          - text: The quickstart for
                          - [ref=e2532] link "Vue"
                          - text: ","
                          - [ref=e2533] link "React"
                          - text: ","
                          - [ref=e2534] link "Svelte"
                          - text: or
                          - [ref=e2535] link "Angular"
                          - text: takes it from there to your agent calling
                          - [ref=e2536] code: ProjectsPage.createProject
                          - text: . A coding agent can do the setup for you with the
                          - [ref=e2537] link:
                            - [ref=e2538] code: ayme
                            - text: skill
                          - text: .
                        - [ref=e2539]:
                          - [ref=e2540] heading "Documentation" [level=2]
                          - [ref=e2541] link "Permalink: Documentation"
                        - [ref=e2544] paragraph:
                          - text: Read the docs at
                          - [ref=e2545] link "ayme-labs.github.io/ayme/docs"
                          - text: ", or here on GitHub, starting from the"
                          - [ref=e2546] link "documentation index"
                          - text: ". The index lists every page in reading order: what Ayme is, install and the quickstarts first, then the guides, one page per framework, the reference and troubleshooting. GitHub renders the pages in place, and the links between them work."
                        - [ref=e2547]:
                          - [ref=e2548] heading "Your data stays with you" [level=2]
                          - [ref=e2549] link "Permalink: Your data stays with you"
                        - [ref=e2552] paragraph: "Ayme runs entirely in your app: in its page, and in its own Node processes where you start it. It has no backend and no account, and it sends nothing to Ayme. Your app's content leaves it in three ways, all set up by you: a coding agent you connect reads the page and your app's Peeks through Ayme's MCP server, which runs on your machine; with WebMCP publication on, an in-browser agent calls your Page Object, Browser and Custom Tools (never Peeks); and each Goal Loop step goes from your own Decision Endpoint, with your key, to the model provider you chose."
                        - [ref=e2553]:
                          - [ref=e2554] heading "License" [level=2]
                          - [ref=e2555] link "Permalink: License"
                        - [ref=e2558] paragraph:
                          - text: Ayme is
                          - [ref=e2559] link "Fair Source"
                          - text: ", licensed under the"
                          - [ref=e2560] link "Functional Source License, Version 1.1, ALv2 Future License"
                          - text: "(FSL-1.1-ALv2). You may use, modify, and redistribute it for any purpose other than a Competing Use, including in your own applications and products. Each version becomes available under the Apache License 2.0 two years after its release."
                        - [ref=e2561] paragraph:
                          - text: "Bundled third-party code keeps its original license; see each package's"
                          - [ref=e2562] code: THIRD_PARTY_NOTICES.txt
                          - text: .
