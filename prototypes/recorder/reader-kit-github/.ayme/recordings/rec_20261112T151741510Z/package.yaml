                        - [ref=e2392] paragraph:
                          - text: The same task on
                          - [ref=e2393] link "Formbricks"
                          - text: ", a real survey app, done by Claude Code through six browser interfaces: rename a survey, change its question, save it and confirm the summary page. Ten runs each; every cell is the median, with the lowest and highest in parentheses."
