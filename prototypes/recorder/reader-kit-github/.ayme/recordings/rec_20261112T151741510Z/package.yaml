                      - [ref=e863] paragraph:
                        - text: Read the docs at
                        - [ref=e864] link "ayme-labs.github.io/ayme/docs" [cursor=pointer]
                        - text: ", or here on GitHub, starting from the"
                        - [ref=e865] link "documentation index" [cursor=pointer]
                        - text: ". The index lists every page in reading order: what Ayme is, install and the quickstarts first, then the guides, one page per framework, the reference and troubleshooting. GitHub renders the pages in place, and the links between them work."
