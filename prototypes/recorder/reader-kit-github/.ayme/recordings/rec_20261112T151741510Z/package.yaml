                        - [ref=e4098] paragraph:
                          - text: "Measured on 2026-10-23 and 2026-10-24 on GitHub-hosted Ubuntu runners, at"
                          - [ref=e4099] link:
                            - [ref=e4100] code: 8a9aad6
                          - text: ", which is"
                          - [ref=e4101] code: main
                          - text: "with the lab app's overlay repinned, with Claude Code 2.1.281 on Sonnet ("
                          - [ref=e4102] code: claude-sonnet-5
                          - text: ") at medium effort, on Formbricks at the lab overlay"
                          - [ref=e4103] link:
                            - [ref=e4104] code: bf06fa5
                          - text: ". Time, tokens, cost and calls are the task's alone: each run first gets the agent ready in a message of its own, which is not counted. Tokens, input and output, are the agent's own input and output tokens. Tokens, all, add the reads and writes of its prompt cache, which carries the page state and tool results from turn to turn. The cost is Claude Code's own figure, plus the Goal Loop's own model cost where it ran. \"No page objects\" is the same app with its page objects switched off, so the agent and the Goal Loop work with Ayme's Browser Tools alone. The full results, with every version a rerun must match, are in"
                          - [ref=e4105] link "the dated summary"
                          - text: ;
                          - [ref=e4106] link "a longer mission"
                          - text: ", which signs in, creates a survey and revises it, ran the same way. The three-run results of 2026-10-15 are in"
                          - [ref=e4107] link "their summary"
                          - text: ", the earlier results from a Mac are in"
                          - [ref=e4108] link "the 2026-10-06 summary"
                          - text: ", and"
                          - [ref=e4109] link "the eval"
                          - text: reruns them.
                        - [ref=e4110]:
                          - [ref=e4111] heading "What you can do with it" [level=2]
                          - [ref=e4112] link "Permalink: What you can do with it"
                        - [ref=e4115] list:
                          - [ref=e4116] listitem:
                            - [ref=e4117] strong: Drive your app from your coding agent.
                            - text: "Claude Code, or any MCP client, calls your Page Object Actions on the page you have open, reads what is on the page and acts on it, while you develop."
                          - [ref=e4118] listitem:
                            - [ref=e4119] strong: Hand the page a goal.
                            - text: "An agent says \"invite Ada as an admin\", and the Goal Loop works the page toward it in small steps, each one judged by Jev, TypeSafe's decision model, instead of the agent's own LLM."
                          - [ref=e4120] listitem:
                            - [ref=e4121] strong: Build an in-app assistant.
                            - text: "An onboarding assistant inside your app gets your Page Object Actions and the page state as its tools, so it works the page while the user watches. A checklist's \"Show me how\" button can run the same actions directly. See"
                            - [ref=e4122] link "Build an in-app assistant"
                            - text: .
                        - [ref=e4123]:
                          - [ref=e4124] heading "How it works" [level=2]
                          - [ref=e4125] link "Permalink: How it works"
                        - [ref=e4128] paragraph: "You mark a Page Object Model and the actions to expose. The build plugin compiles them into your app, and when the app runs, Ayme offers three kinds of tools to agents: to a coding agent through Ayme's MCP server, and to agents in the browser through WebMCP, the browser's way of offering tools on a page:"
                        - [ref=e4129] list:
                          - [ref=e4130] listitem:
                            - [ref=e4131] strong: Page Object Tools
                            - text: ": your marked actions, such as"
                            - [ref=e4132] code: ProjectsPage.createProject
                            - text: .
                          - [ref=e4133] listitem:
                            - [ref=e4134] strong: Browser Tools
                            - text: ": built-in operations on the page, such as"
                            - [ref=e4135] code: click
                            - text: and
                            - [ref=e4136] code: fill
                            - text: ", aimed at what"
                            - [ref=e4137] code: snapshot
                            - text: shows.
                          - [ref=e4138] listitem:
                            - [ref=e4139] strong: Custom Tools
                            - text: ": operations of your own on one element, such as highlighting it for the user."
                        - [ref=e4140] paragraph:
                          - text: "While you develop, a coding agent also gets"
                          - [ref=e4141] strong: Peek Tools
                          - text: ": they read app state the page does not show, such as a store or what your server holds, from the page and from your app's own Node processes. WebMCP never publishes them. See"
                          - [ref=e4142] link:
                            - [ref=e4143] code: ayme.peek
                          - text: .
                        - [ref=e4144] paragraph:
                          - text: The
                          - [ref=e4145] strong: Goal Loop
                          - text: "runs on top of them:"
                          - [ref=e4146] code: goal
                          - text: takes a goal in natural language and lets Jev pick one operation per step until the goal is met or it needs the agent. Jev is reached through a
                          - [ref=e4147] strong: Decision Endpoint
                          - text: ", one route in your backend, or in your dev server while you develop, that adds your TypeSafe or OpenRouter key."
                        - [ref=e4148] paragraph:
                          - text: The
                          - [ref=e4149] strong: Inspector
                          - text: "is an in-page panel that shows your Page Objects, what the agent sees and every tool, and runs them by hand."
                        - [ref=e4150] paragraph:
                          - [ref=e4151] link:
                            - [ref=e4152] img "The Inspector's Tools lens listing Page Object Tools and Browser Tools"
                        - [ref=e4153]:
                          - [ref=e4154] heading "Install" [level=2]
                          - [ref=e4155] link "Permalink: Install"
                        - [ref=e4158]:
                          - [ref=e4159]:
                            - text: "npm install @ayme-dev/ayme @ayme-dev/vue"
                            - [ref=e4160]: "# or react, svelte"
                            - text: "npm install -D @ayme-dev/unplugin-ayme @playwright/test"
                          - [ref=e4162] button "Copy code to clipboard"
                        - [ref=e4166] paragraph:
                          - text: "On Angular,"
                          - [ref=e4167] code: "ng add @ayme-dev/angular"
                          - text: "sets everything up. Then mark a Page Object Model:"
                        - [ref=e4168]:
                          - [ref=e4169]: "import { ayme } from \"@ayme-dev/ayme\"; import type { Page } from \"@playwright/test\"; @ayme export class ProjectsPage { private readonly page: Page; constructor(page: Page) { this.page = page; } @ayme.action async createProject(name: string) { await this.page.getByRole(\"button\", { name: \"New project\" }).click(); await this.page.getByRole(\"textbox\", { name: \"Project name\" }).fill(name); await this.page.getByRole(\"button\", { name: \"Create\" }).click(); } }"
                          - [ref=e4171] button "Copy code to clipboard"
                        - [ref=e4175] paragraph:
                          - text: The quickstart for
                          - [ref=e4176] link "Vue"
                          - text: ","
                          - [ref=e4177] link "React"
                          - text: ","
                          - [ref=e4178] link "Svelte"
                          - text: or
                          - [ref=e4179] link "Angular"
                          - text: takes it from there to your agent calling
                          - [ref=e4180] code: ProjectsPage.createProject
                          - text: . A coding agent can do the setup for you with the
                          - [ref=e4181] link:
                            - [ref=e4182] code: ayme
                            - text: skill
                          - text: .
                        - [ref=e4183]:
                          - [ref=e4184] heading "Documentation" [level=2]
                          - [ref=e4185] link "Permalink: Documentation"
                        - [ref=e4188] paragraph:
                          - text: Read the docs at
                          - [ref=e4189] link "ayme-labs.github.io/ayme/docs"
                          - text: ", or here on GitHub, starting from the"
                          - [ref=e4190] link "documentation index"
                          - text: ". The index lists every page in reading order: what Ayme is, install and the quickstarts first, then the guides, one page per framework, the reference and troubleshooting. GitHub renders the pages in place, and the links between them work."
                        - [ref=e4191]:
                          - [ref=e4192] heading "Your data stays with you" [level=2]
                          - [ref=e4193] link "Permalink: Your data stays with you"
                        - [ref=e4196] paragraph: "Ayme runs entirely in your app: in its page, and in its own Node processes where you start it. It has no backend and no account, and it sends nothing to Ayme. Your app's content leaves it in three ways, all set up by you: a coding agent you connect reads the page and your app's Peeks through Ayme's MCP server, which runs on your machine; with WebMCP publication on, an in-browser agent calls your Page Object, Browser and Custom Tools (never Peeks); and each Goal Loop step goes from your own Decision Endpoint, with your key, to the model provider you chose."
                        - [ref=e4197]:
                          - [ref=e4198] heading "License" [level=2]
                          - [ref=e4199] link "Permalink: License"
                        - [ref=e4202] paragraph:
                          - text: Ayme is
                          - [ref=e4203] link "Fair Source"
                          - text: ", licensed under the"
                          - [ref=e4204] link "Functional Source License, Version 1.1, ALv2 Future License"
                          - text: "(FSL-1.1-ALv2). You may use, modify, and redistribute it for any purpose other than a Competing Use, including in your own applications and products. Each version becomes available under the Apache License 2.0 two years after its release."
                        - [ref=e4205] paragraph:
                          - text: "Bundled third-party code keeps its original license; see each package's"
                          - [ref=e4206] code: THIRD_PARTY_NOTICES.txt
                          - text: .
